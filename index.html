<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>🔐 加密页面 - 需密钥访问</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --border: #334155;
        --text: #e2e8f0;
        --text2: #94a3b8;
        --accent: #3b82f6;
        --danger: #ef4444;
        --success: #10b981;
        --radius: 14px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    body{
        font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
        background:var(--bg);
        min-height:100vh;
        min-height:-webkit-fill-available;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:16px;
        -webkit-tap-highlight-color:transparent;
        -webkit-user-select:none;
        user-select:none;
    }
    .unlock-container{
        width:100%;
        max-width:380px;
        background:var(--card);
        border-radius:var(--radius);
        padding:28px 22px;
        border:1px solid var(--border);
        box-shadow:0 8px 32px rgba(0,0,0,0.45);
        text-align:center;
        transition:all 0.35s ease;
    }
    .unlock-container.error-shake{
        animation:shake 0.5s ease;
    }
    @keyframes shake{
        0%,100%{transform:translateX(0)}
        15%{transform:translateX(-8px)}
        30%{transform:translateX(8px)}
        45%{transform:translateX(-6px)}
        60%{transform:translateX(6px)}
        75%{transform:translateX(-3px)}
        90%{transform:translateX(3px)}
    }
    .lock-icon{
        font-size:48px;
        margin-bottom:10px;
        display:block;
        animation:float 3s ease-in-out infinite;
    }
    @keyframes float{
        0%,100%{transform:translateY(0)}
        50%{transform:translateY(-8px)}
    }
    h2{
        font-size:1.2rem;
        color:var(--text);
        margin-bottom:6px;
        font-weight:700;
        letter-spacing:-0.01em;
    }
    .subtitle{
        font-size:0.8rem;
        color:var(--text2);
        margin-bottom:18px;
        line-height:1.4;
    }
    .input-group{
        position:relative;
        margin-bottom:14px;
    }
    input[type="password"],
    input[type="text"]{
        width:100%;
        padding:14px 44px 14px 16px;
        background:#0f172a;
        border:2px solid var(--border);
        border-radius:10px;
        color:var(--text);
        font-size:1rem;
        letter-spacing:0.05em;
        outline:none;
        transition:border-color 0.2s;
        -webkit-appearance:none;
    }
    input:focus{
        border-color:var(--accent);
        box-shadow:0 0 0 3px rgba(59,130,246,0.2);
    }
    .toggle-vis{
        position:absolute;
        right:8px;
        top:50%;
        transform:translateY(-50%);
        background:none;
        border:none;
        font-size:1.3rem;
        cursor:pointer;
        padding:6px 8px;
        color:var(--text2);
        -webkit-tap-highlight-color:transparent;
        z-index:2;
    }
    .toggle-vis:active{color:var(--text)}
    .btn-unlock{
        width:100%;
        padding:15px;
        background:linear-gradient(135deg,#3b82f6,#6366f1);
        color:#fff;
        border:none;
        border-radius:10px;
        font-size:1rem;
        font-weight:700;
        cursor:pointer;
        letter-spacing:0.03em;
        transition:all 0.2s;
        box-shadow:0 4px 15px rgba(59,130,246,0.3);
        -webkit-tap-highlight-color:transparent;
        margin-top:4px;
    }
    .btn-unlock:active{
        transform:scale(0.97);
        box-shadow:0 2px 8px rgba(59,130,246,0.2);
    }
    .btn-unlock:disabled{
        opacity:0.6;
        transform:none;
        cursor:not-allowed;
    }
    .error-msg{
        color:var(--danger);
        font-size:0.8rem;
        margin-top:10px;
        min-height:20px;
        font-weight:500;
        transition:opacity 0.3s;
    }
    .hint{
        font-size:0.7rem;
        color:var(--text2);
        margin-top:12px;
        opacity:0.7;
    }
    /* iframe全屏覆盖 */
    .iframe-overlay{
        display:none;
        position:fixed;
        top:0;left:0;
        width:100%;height:100%;
        border:none;
        z-index:999;
        background:#fff;
    }
    .iframe-overlay.active{
        display:block;
    }
    /* 加载旋转 */
    .spinner-overlay{
        display:none;
        position:fixed;
        top:0;left:0;right:0;bottom:0;
        background:rgba(15,23,42,0.85);
        z-index:1000;
        align-items:center;
        justify-content:center;
        flex-direction:column;
        gap:12px;
    }
    .spinner-overlay.active{
        display:flex;
    }
    .spinner-circle{
        width:40px;height:40px;
        border:3px solid rgba(255,255,255,0.2);
        border-top-color:#fff;
        border-radius:50%;
        animation:spin 0.8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner-text{
        color:var(--text2);
        font-size:0.85rem;
    }
    @media(max-width:360px){
        .unlock-container{padding:20px 14px}
        h2{font-size:1.05rem}
        .lock-icon{font-size:38px}
        input{font-size:0.9rem;padding:12px 40px 12px 14px}
        .btn-unlock{padding:13px;font-size:0.9rem}
    }
</style>
</head>
<body>

<!-- 解锁界面 -->
<div class="unlock-container" id="unlockContainer">
    <span class="lock-icon">🔐</span>
    <h2>此页面已加密</h2>
    <p class="subtitle">请输入密钥以访问页面内容</p>
    <div class="input-group">
        <input
        type="password"
        id="passwordInput"
        placeholder="输入密钥..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        enterkeyhint="go"
    >
    <button class="toggle-vis" id="toggleVisBtn" type="button" aria-label="显示密钥">👁️</button>
</div>
<button class="btn-unlock" id="btnUnlock" type="button">🔓 解密访问</button>
<p class="error-msg" id="errorMsg"></p>
<p class="hint">💡 请联系页面提供者获取密钥</p>
</div>

<!-- 加载遮罩 -->
<div class="spinner-overlay" id="spinnerOverlay">
    <div class="spinner-circle"></div>
    <span class="spinner-text">正在解密...</span>
</div>

<!-- 内容iframe -->
<iframe class="iframe-overlay" id="contentFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation allow-modals" title="解密内容"></iframe>

    const unlockContainer = document.getElementById('unlockContainer');
    const passwordInput = document.getElementById('passwordInput');
    const btnUnlock = document.getElementById('btnUnlock');
    const errorMsg = document.getElementById('errorMsg');
    const toggleVisBtn = document.getElementById('toggleVisBtn');
    const spinnerOverlay = document.getElementById('spinnerOverlay');
    const contentFrame = document.getElementById('contentFrame');

    let visToggle = false;
    let isDecrypting = false;

    // 显示/隐藏密码 — 【修复】仅使用 click 事件，移除冲突的 touchend
    toggleVisBtn.addEventListener('click', function(e) {
        e.preventDefault();
        visToggle = !visToggle;
        passwordInput.type = visToggle ? 'text' : 'password';
        toggleVisBtn.textContent = visToggle ? '🙈' : '👁️';
        // 切换后重新聚焦输入框
        passwordInput.focus();
    });

    // 回车键解密
    passwordInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !isDecrypting) {
            e.preventDefault();
            handleUnlock();
        }
    });

    // 工具函数
    function base64ToArrayBuffer(base64) {
        const binary = atob(base64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
    }

    async function deriveKey(password, saltBuffer) {
        const passwordBytes = new TextEncoder().encode(password);
        const keyMaterial = await crypto.subtle.importKey(
            'raw', passwordBytes, 'PBKDF2', false, ['deriveKey']
        );
        return await crypto.subtle.deriveKey({
                name: 'PBKDF2',
                salt: saltBuffer,
                iterations: 150000,
                hash: 'SHA-256',
            },
            keyMaterial, {
                name: 'AES-GCM',
                length: 256,
            },
            false,
            ['decrypt']
        );
    }

    async function decryptData(password) {
        // 解析加密数据
        const parts = ENCRYPTED_DATA.split('|||');
        if (parts.length !== 3) {
            throw new Error('数据格式无效');
        }
        const saltBuffer = base64ToArrayBuffer(parts[0]);
        const ivBuffer = base64ToArrayBuffer(parts[1]);
        const ctBuffer = base64ToArrayBuffer(parts[2]);

        const key = await deriveKey(password, saltBuffer);
        try {
            const plaintextBuffer = await crypto.subtle.decrypt({
                    name: 'AES-GCM',
                    iv: new Uint8Array(ivBuffer),
                    tagLength: 128,
                },
                key,
                ctBuffer
            );
            return new TextDecoder().decode(plaintextBuffer);
        } catch (err) {
            throw new Error('密钥错误，解密失败');
        }
    }

    async function handleUnlock() {
        if (isDecrypting) return;
        const password = passwordInput.value.trim();
        if (!password) {
            showError('请输入密钥');
            shakeContainer();
            passwordInput.focus();
            return;
        }
        isDecrypting = true;
        btnUnlock.disabled = true;
        errorMsg.textContent = '';
        spinnerOverlay.classList.add('active');
        // 让按钮文字显示加载状态
        btnUnlock.textContent = '⏳ 正在解密...';

        // 模拟最小延迟，让用户看到加载动画
        const minDelay = new Promise(resolve => setTimeout(resolve, 400));

        try {
            const [decryptedHTML] = await Promise.all([
                decryptData(password),
                minDelay,
            ]);
            // 解密成功
            spinnerOverlay.classList.remove('active');
            unlockContainer.style.display = 'none';
            contentFrame.classList.add('active');
            contentFrame.srcdoc = decryptedHTML;
            // 聚焦iframe以便滚动
            setTimeout(() => {
                contentFrame.focus();
            }, 300);
        } catch (err) {
            spinnerOverlay.classList.remove('active');
            showError(err.message || '解密失败，请检查密钥');
            shakeContainer();
            passwordInput.select();
            passwordInput.focus();
        } finally {
            isDecrypting = false;
            btnUnlock.disabled = false;
            btnUnlock.textContent = '🔓 解密访问';
        }
    }

    function showError(msg) {
        errorMsg.textContent = '⚠️ ' + msg;
    }

    function shakeContainer() {
        unlockContainer.classList.remove('error-shake');
        void unlockContainer.offsetWidth;
        unlockContainer.classList.add('error-shake');
        setTimeout(() => {
            unlockContainer.classList.remove('error-shake');
        }, 500);
    }

    // 【修复】仅使用 click 事件，移除冲突的 touchend
    btnUnlock.addEventListener('click', function(e) {
        e.preventDefault();
        handleUnlock();
    });

    // 页面加载时自动聚焦密码输入框
    setTimeout(() => {
        passwordInput.focus();
    }, 500);

    // 防止意外缩放
    document.addEventListener('gesturestart', function(e) {
        if (e.target.tagName !== 'INPUT') {
            e.preventDefault();
        }
    }, { passive: false });
